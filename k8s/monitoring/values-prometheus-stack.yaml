# Helm values — kube-prometheus-stack
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace \
#   -f k8s/monitoring/values-prometheus-stack.yaml

# ── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Scrape all ServiceMonitors in all namespaces (no label filter)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Scrape all PrometheusRules in all namespaces
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Retention
    retention: 15d
    retentionSize: "8GB"

    # Resources (tuned for Minikube 4 CPU / 4 GB)
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Expose Prometheus UI via NodePort for easy Minikube access
  service:
    type: NodePort
    nodePort: 30090

# ── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  config:
    global:
      resolve_timeout: 5m
      # Le mot de passe (app password Gmail) n'est volontairement PAS ici —
      # il est passé au déploiement via `helm upgrade --set
      # alertmanager.config.global.smtp_auth_password=...` pour ne jamais
      # finir en clair dans Git (même pattern que billcom-secrets-external
      # pour Stripe : secret injecté hors dépôt).
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'med.aziz.bouthelja@gmail.com'
      smtp_auth_username: 'med.aziz.bouthelja@gmail.com'

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
        - match:
            severity: warning
          receiver: 'billcom-warning-alerts'

    receivers:
      - name: 'default'
        # Null sink — pas d'email pour le reste (évite le bruit)
      - name: 'critical-alerts'
        email_configs:
          - to: 'med.aziz.bouthelja@gmail.com'
            send_resolved: true
      # Nommé "billcom-warning-alerts" (préfixé) plutôt que "warning-alerts" :
      # l'Operator fusionne cette config avec toute ressource AlertmanagerConfig
      # présente dans le cluster (alertmanagerConfigSelector par défaut = tout
      # sélectionner), et un receiver "warning-alerts" y existait déjà, causant
      # une collision de nom ("notification config name is not unique").
      - name: 'billcom-warning-alerts'
        # Null sink pour l'instant — les alertes "warning" (latence, CPU...)
        # restent visibles dans Grafana/Alertmanager sans spammer la boîte
        # mail. Ajouter un email_configs ici si tu veux aussi les recevoir.
        #     send_resolved: true
      - name: 'warning-alerts'
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        #     channel: '#alerts-warning'
        #     send_resolved: true

  service:
    type: NodePort
    nodePort: 30093

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminPassword: "billcom-grafana-2025"

  service:
    type: NodePort
    nodePort: 30030

  # Sidecar picks up ConfigMaps labelled grafana_dashboard=1 from ALL namespaces
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      defaultDatasourceEnabled: false

  # Définir les deux datasources manuellement (désactivation du Prometheus auto du chart)
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-kube-prometheus-prometheus:9090
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 30s
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      isDefault: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── node-exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── Disable components not needed on Minikube single-node ─────────────────────
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
